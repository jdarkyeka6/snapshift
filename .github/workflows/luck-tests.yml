name: Lucky Draw Tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/lucky-draw.test.cjs'
      - 'package.json'
      - '.github/workflows/luck-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test Lucky Draw on simulated boards
        run: node tests/lucky-draw.test.cjs
