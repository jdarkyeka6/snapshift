name: SnapShift TestFlight Upload - First Attempt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/snapshift-testflight-first-upload.yml']

permissions:
  contents: read

concurrency:
  group: snapshift-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Sign and upload SnapShift on requested release
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check Apple API secrets without printing values
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing SnapShift GitHub secret $name"
              exit 1
            fi
          done
          echo "Apple API configuration is present."
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS app and icon
        run: |
          npm run ios:add
          npx cap sync ios
      - name: Prepare Fastlane
        run: |
          mkdir -p ios/App/fastlane
          cp ios-ci/Gemfile ios/App/Gemfile
          cp ios-ci/Fastfile ios/App/fastlane/Fastfile
      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App
      - name: Build, sign and upload to TestFlight
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane beta
