name: TestFlight Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Sign and upload SnapShift (manual)
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Generate native iOS app
        run: |
          npm run build
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build, sign and upload IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: bash scripts/ios-release.sh
